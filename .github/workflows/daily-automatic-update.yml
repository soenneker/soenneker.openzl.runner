name: daily-automatic-update
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            library: libopenzl.so
          - os: windows-latest
            rid: win-x64
            library: openzl.dll
    runs-on: ${{ matrix.os }}
    env:
      ASPNETCORE_ENVIRONMENT: Production
      OpenZl__OutputDirectory: ${{ github.workspace }}/stage
      OPENZL_NATIVE_LIBRARY: ${{ github.workspace }}/stage/${{ matrix.library }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Configure MSVC SDK for clang-cl
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/configure-msvc.ps1
      - name: Build and verify native library
        env:
          OpenZl__WorkingDirectory: ${{ runner.temp }}/openzl
        run: dotnet run --project src/Soenneker.OpenZl.Runner -c Release -- --OpenZl:UpdateRepository=false
      - name: Verify staged native ABI
        run: dotnet test --project test/Soenneker.OpenZl.Runner.Tests -c Release -- --treenode-filter "/*/*/OpenZlRunnerTests/*"
      - uses: actions/upload-artifact@v4
        with:
          name: openzl-${{ matrix.rid }}
          path: stage/
      - name: Set package version
        shell: pwsh
        run: '"BUILD_VERSION=4.0.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_ENV'
      - name: Log in to NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: soenneker
      - name: Update platform package
        env:
          OpenZl__WorkingDirectory: ${{ runner.temp }}/openzl
          GH__USERNAME: soenneker
          GH__TOKEN: ${{ secrets.GH__TOKEN }}
          GIT__TOKEN: ${{ secrets.GIT__TOKEN }}
          GIT__NAME: ${{ secrets.GIT__NAME }}
          GIT__EMAIL: ${{ secrets.GIT__EMAIL }}
          NUGET__TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet run --project src/Soenneker.OpenZl.Runner -c Release --no-build -- --OpenZl:UpdateRepository=true
